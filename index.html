<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Interés Compuesto</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }
    .app {
      max-width: 720px;
      margin: 0 auto;
      padding: 18px;
    }
    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,.08);
    }
    h1 { font-size: 26px; margin: 0 0 8px; }
    h2 { font-size: 20px; margin-top: 0; }
    .sub { color: #6b7280; margin-top: 0; }
    label {
      display: block;
      font-weight: bold;
      margin: 14px 0 6px;
    }
    input {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      outline: none;
    }
    input:focus { border-color: #6366f1; }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 14px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #111827;
      color: white;
      transition: background 0.2s;
    }
    button:hover { background: #1f2937; }
    button.secondary { background: #374151; }
    button.secondary:hover { background: #4b5563; }
    .result {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: #eef2ff;
      line-height: 1.55;
    }
    .big {
      font-size: 30px;
      font-weight: bold;
      margin: 4px 0;
    }
    .error {
      background: #fff1f2;
      color: #9f1239;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 14px;
    }
    th, td {
      border-bottom: 1px solid #e5e7eb;
      padding: 9px 6px;
      text-align: right;
    }
    th:first-child, td:first-child { text-align: center; }
    .note { font-size: 13px; color: #6b7280; }
  </style>
</head>
<body>
  <div class="app">
    <div class="card">
      <h1>Calculadora de Interés Compuesto</h1>
      <p class="sub">Calcula cuánto acumulas y cuántos eventos necesitas para llegar a una meta.</p>
      
      <label for="capital">Capital inicial ($)</label>
      <input id="capital" type="text" inputmode="decimal" value="5.50">
      
      <label for="tasa">Interés por evento (%)</label>
      <input id="tasa" type="text" inputmode="decimal" value="50">
      
      <label for="eventos">Número de eventos</label>
      <input id="eventos" type="number" inputmode="numeric" min="0" step="1" value="10">
      
      <button onclick="calcularCrecimiento()">Calcular crecimiento</button>
      <div id="resultadoCrecimiento" class="result" style="display:none"></div>
    </div>

    <div class="card">
      <h2>¿Cuántos eventos necesito para llegar a una meta?</h2>
      <label for="meta">Meta ($)</label>
      <input id="meta" type="text" inputmode="decimal" value="200">
      <button class="secondary" onclick="calcularMeta()">Calcular eventos necesarios</button>
      <div id="resultadoMeta" class="result" style="display:none"></div>
    </div>

    <div class="card">
      <h2>Tabla evento por evento</h2>
      <p class="note">La tabla se genera al presionar “Calcular crecimiento”.</p>
      <div style="overflow-x:auto">
        <table id="tabla">
          <thead>
            <tr>
              <th>Evento</th>
              <th>Capital inicial</th>
              <th>Ganancia</th>
              <th>Capital final</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const dinero = new Intl.NumberFormat('en-US', {
      style: 'currency',
      currency: 'USD'
    });

    function numero(id) {
      const texto = document.getElementById(id).value.trim().replace(',', '.');
      return Number(texto);
    }

    function mostrarError(id, mensaje) {
      const caja = document.getElementById(id);
      caja.style.display = 'block';
      caja.className = 'result error';
      caja.innerHTML = mensaje;
    }

    function calcularCrecimiento() {
      const capital = numero('capital');
      const tasaPct = numero('tasa');
      const eventos = Number(document.getElementById('eventos').value);

      if (!(capital > 0) || !(tasaPct > -100) || !Number.isInteger(eventos) || eventos < 0) {
        mostrarError('resultadoCrecimiento', 
          'Revisa los datos. El capital debe ser mayor que 0 y los eventos deben ser un número entero igual o mayor que 0.'
        );
        return;
      }

      const tasa = tasaPct / 100;
      const final = capital * Math.pow(1 + tasa, eventos);
      const gananciaTotal = final - capital;

      const caja = document.getElementById('resultadoCrecimiento');
      caja.style.display = 'block';
      caja.className = 'result';
      caja.innerHTML = `
        <div>Capital futuro</div>
        <div class="big">${dinero.format(final)}</div>
        <div>Ganancia acumulada: <b>${dinero.format(gananciaTotal)}</b></div>
        <div>Factor aplicado: <b>${(1 + tasa).toFixed(4)}</b> por evento</div>
      `;

      const tbody = document.querySelector('#tabla tbody');
      tbody.innerHTML = '';
      
      let actual = capital;
      for (let i = 0; i <= eventos; i++) {
        const fila = document.createElement('tr');
        if (i === 0) {
          fila.innerHTML = `<td>0</td><td>${dinero.format(capital)}</td><td>${dinero.format(0)}</td><td>${dinero.format(capital)}</td>`;
        } else {
          const inicio = actual;
          const ganancia = inicio * tasa;
          const cierre = inicio + ganancia;
          actual = cierre;
          fila.innerHTML = `<td>${i}</td><td>${dinero.format(inicio)}</td><td>${dinero.format(ganancia)}</td><td>${dinero.format(cierre)}</td>`;
        }
        tbody.appendChild(fila);
      }

      guardar();
    }

    function calcularMeta() {
      const capital = numero('capital');
      const tasaPct = numero('tasa');
      const meta = numero('meta');

      if (!(capital > 0) || !(meta > 0) || !(tasaPct > 0)) {
        mostrarError('resultadoMeta', 'Para calcular una meta, el capital, la meta y la tasa deben ser mayores que 0.');
        return;
      }

      if (meta <= capital) {
        const caja = document.getElementById('resultadoMeta');
        caja.style.display = 'block';
        caja.className = 'result';
        caja.innerHTML = 'Ya alcanzaste esa meta con tu capital inicial. Eventos necesarios: <b>0</b>.';
        return;
      }

      const tasa = tasaPct / 100;
      const eventos = Math.ceil(Math.log(meta / capital) / Math.log(1 + tasa));
      const final = capital * Math.pow(1 + tasa, eventos);

      const caja = document.getElementById('resultadoMeta');
      caja.style.display = 'block';
      caja.className = 'result';
      caja.innerHTML = `
        <div>Eventos necesarios</div>
        <div class="big">${eventos}</div>
        <div>Capital aproximado al completar esos eventos: <b>${dinero.format(final)}</b></div>
      `;

      guardar();
    }

    function guardar() {
      const datos = {
        capital: document.getElementById('capital').value,
        tasa: document.getElementById('tasa').value,
        eventos: document.getElementById('eventos').value,
        meta: document.getElementById('meta').value
      };
      localStorage.setItem('calculadoraInteres', JSON.stringify(datos));
    }

    function cargar() {
      const guardado = localStorage.getItem('calculadoraInteres');
      if (!guardado) return;
      try {
        const d = JSON.parse(guardado);
        if (d.capital) document.getElementById('capital').value = d.capital;
        if (d.tasa) document.getElementById('tasa').value = d.tasa;
        if (d.eventos) document.getElementById('eventos').value = d.eventos;
        if (d.meta) document.getElementById('meta').value = d.meta;
      } catch (e) {}
    }

    cargar();
    calcularCrecimiento();
  </script>
</body>
</html>
